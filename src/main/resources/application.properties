spring.application.name=PhishGuard

server.port=${PORT:5000}
server.address=0.0.0.0

spring.datasource.url=${DATABASE_URL:jdbc:sqlite:phishguard.db}
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=com.josbin.phishguard.config.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.thymeleaf.cache=false

app.base-url=${APP_BASE_URL:http://localhost:5000}
app.secret-key=${SECRET_KEY:dev-secret-change-this}

spring.mail.host=${MAIL_SERVER:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.test-connection=false
logging.level.org.springframework.security=DEBUG
logging.level.com.josbin.phishguard=DEBUG
