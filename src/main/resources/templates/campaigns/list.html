<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>PhishGuard</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"></head><body><nav class="navbar navbar-dark bg-dark px-4 mb-4"><a class="navbar-brand" href="/campaigns">🎧 PhishGuard</a><div><a href="/campaigns" class="btn btn-sm btn-outline-light me-2">Dashboard</a><a href="/campaigns/new" class="btn btn-sm btn-warning me-2">New Campaign</a><form th:action="@{/logout}" method="post" style="display:inline"><button class="btn btn-sm btn-danger">Logout</button></form></div></nav><div class="container"><div th:if="${message}" class="alert alert-success" th:text="${message}"></div><h1 class="mb-4">Campaigns <a href="/campaigns/new" class="btn btn-warning float-end">+ New Campaign</a></h1><div th:if="${#lists.isEmpty(campaigns)}" class="alert alert-secondary">No campaigns yet. Create one above.</div><table th:unless="${#lists.isEmpty(campaigns)}" class="table table-hover"><thead class="table-dark"><tr><th>Name</th><th>Template</th><th>Status</th><th>Created</th><th></th></tr></thead><tbody><tr th:each="c : ${campaigns}"><td th:text="${c.name}"></td><td th:text="${c.template.name}"></td><td><span class="badge" th:classappend="${c.status == 'active'} ? ' bg-success' : ' bg-secondary'" th:text="${c.status}"></span></td><td th:text="${#temporals.format(c.createdAt,'yyyy-MM-dd')}"></td><td><a th:href="@{'/campaigns/' + ${c.id}}" class="btn btn-sm btn-outline-primary">View</a></td></tr></tbody></table></div></body></html>
