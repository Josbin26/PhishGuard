<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>New Campaign</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-4 mb-4">
    <a class="navbar-brand" href="/campaigns">🎧 PhishGuard</a>

    <div>
        <a href="/campaigns"
           class="btn btn-sm btn-outline-light me-2">
            Dashboard
        </a>

        <form th:action="@{/logout}"
              method="post"
              style="display:inline">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <button class="btn btn-sm btn-danger">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container">

    <div th:if="${error}"
         class="alert alert-danger"
         th:text="${error}">
    </div>

    <h1>New Campaign</h1>

    <form method="POST"
          enctype="multipart/form-data"
          th:action="@{/campaigns/new}"
          style="max-width:520px">

        <!-- Spring Security CSRF token -->
        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="mb-3">
            <label class="form-label">
                Campaign Name
            </label>

            <input type="text"
                   name="name"
                   class="form-control"
                   placeholder="e.g. Q3 Awareness Test"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Phishing Template
            </label>

            <select name="template_id"
                    class="form-select"
                    required>

                <option th:each="t : ${templates}"
                        th:value="${t.id}"
                        th:text="${t.name + ' (' + t.difficulty + ')'}">
                </option>

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Upload Email List
                <small class="text-muted">
                    (.docx — one email per line)
                </small>
            </label>

            <input type="file"
                   name="emails_docx"
                   class="form-control"
                   accept=".docx"
                   required
                   id="emailFile">

            <div class="form-text text-danger">
                ⚠️ A .docx email list is required to create a campaign.
            </div>
        </div>

        <button type="submit"
                class="btn btn-warning">
            Create Campaign &amp; Get URL
        </button>

    </form>

</div>

<script>
document.querySelector('form[th\\:action="@{/campaigns/new}"]').addEventListener('submit', function(e) {
    const f = document.getElementById('emailFile');

    if (!f.files.length) {
        e.preventDefault();
        alert('Please upload a .docx email list to continue.');
        return;
    }

    if (!f.files[0].name.toLowerCase().endsWith('.docx')) {
        e.preventDefault();
        alert('Only .docx files are accepted.');
        f.value = '';
    }
});
</script>

</body>
</html>
